<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percent Solids Calculator</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div id="app-container">
        <h1>Percent Solids Calculator</h1>
        
        <form id="calculator-form">
            <div class="input-group">
                <label for="diameter">Diameter:</label>
                <div class="input-with-unit">
                    <input type="number" id="diameter" value="100" step="any" min="0">
                    <select id="diameter-unit">
                        <option value="nm">nm</option>
                        <option value="µm">µm</option>
                    </select>
                </div>
            </div>
            
            <div class="input-group">
                <label for="composition">Composition:</label>
                <div class="input-with-unit">
                    <select id="composition">
                        <option value="polystyrene" data-density="1.05">Polystyrene (1.05 g/mL)</option>
                        <option value="silica" data-density="2.00">Silica (2.00 g/mL)</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
            </div>

            <div class="input-group hidden" id="custom-density-group">
                <label for="density">Custom Density:</label>
                <div class="input-with-unit">
                    <input type="number" id="density" value="1.05" step="any" min="0">
                    <span class="unit-label">g/mL</span>
                </div>
            </div>
            
            <div class="input-group">
                <label for="solids">% Solids:</label>
                <div class="input-with-unit">
                    <input type="number" id="solids" value="1" step="any" min="0">
                    <span class="unit-label">%</span>
                </div>
            </div>
        </form>
        
        <div id="result" class="result-display">
            <!-- Result will be displayed here -->
        </div>
    </div>
    
    <script src="calculator.js"></script>
</body>
</html>
